[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpricing"
version = "0.1.0"
description = "Monte Carlo pricing engine for equity derivatives under Black-Scholes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Amar" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy>=1.7"]

[tool.setuptools]
packages = ["mcpricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
